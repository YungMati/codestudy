.cs-view {min-width:0; color:var(--ink); overflow-wrap:anywhere;}
.cs-breadcrumb,.cs-actions,.cs-row,.cs-page-head,.cs-section h2,.cs-btn,.cs-legend,.cs-legend li,.cs-study-tools,.cs-toggle {display:flex;align-items:center;}
.cs-breadcrumb {flex-wrap:wrap; column-gap:.65rem; color:var(--mut); font-size:.875rem; margin:0 0 1.4rem;}
.cs-breadcrumb button {border:0;background:transparent;color:inherit;min-height:2.5rem;font:inherit;cursor:pointer;padding:0;}
.cs-breadcrumb button:hover {color:var(--acc);text-decoration:underline;}
.cs-breadcrumb [aria-current] {color:var(--ink);}
.cs-page-head,.cs-row,.cs-study-tools {justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.cs-page-head {align-items:flex-end;margin:0 0 2rem;}
.cs-heading {font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.09;letter-spacing:-.05em;margin:0;font-weight:760;color:var(--ink);}
.cs-meta,.cs-muted {color:var(--mut);font-size:.9rem;line-height:1.5;}
.cs-page-head .cs-meta {margin:.55rem 0 0;}
.cs-actions {gap:.55rem;flex-wrap:wrap;}
.cs-btn {display:inline-flex;justify-content:center;gap:.48rem;min-height:2.7rem;border:1px solid transparent;border-radius:.55rem;padding:.6rem .95rem;line-height:1.2;font:inherit;font-weight:650;font-size:.875rem;cursor:pointer;transition:background-color .15s,border-color .15s;}
.cs-btn svg,.cs-small-icon svg,.cs-empty-icon svg {flex-shrink:0;}
.cs-btn-primary {background:var(--acc);color:white;}
.cs-btn-primary:hover {background:color-mix(in srgb,var(--acc) 85%,black);}
.cs-btn-secondary {color:var(--ink);background:var(--card);border-color:var(--line);}
.cs-btn-secondary:hover {background:var(--bg);border-color:var(--mut);}
.cs-btn-soft,.cs-btn-plain,.cs-btn-danger {color:var(--acc);background:var(--soft);}
.cs-btn-plain,.cs-btn-danger {background:transparent;}
.cs-btn-danger {color:#a93848;}
.cs-btn-plain:hover,.cs-btn-soft:hover,.cs-btn-danger:hover {background:color-mix(in srgb,var(--soft) 83%,var(--line));}
.cs-panel {background:var(--card);border:1px solid var(--line);border-radius:1rem;min-width:0;}
.cs-view h2,.cs-export h2,.cs-alert h2 {font-size:1.15rem;line-height:1.3;letter-spacing:-.027em;margin:0;font-weight:720;}
.cs-empty {padding:clamp(2rem,7vw,4.5rem) 1.4rem;display:flex;align-items:center;flex-direction:column;text-align:center;gap:.7rem;}
.cs-empty h2,.cs-empty h3 {font-size:1.25rem;letter-spacing:-.025em;margin:0;}
.cs-empty p {max-width:42ch;margin:0;color:var(--mut);font-size:.95rem;line-height:1.55;}
.cs-empty-icon,.cs-small-icon {display:inline-grid;place-items:center;border-radius:.7rem;color:var(--acc);background:var(--soft);}
.cs-empty-icon {width:3.6rem;height:3.6rem;margin-bottom:.4rem;}
.cs-small-icon {width:2.1rem;height:2.1rem;flex-shrink:0;}
.cs-empty .cs-actions,.cs-empty>.cs-btn {margin-top:.55rem;justify-content:center;}
.cs-stack {display:grid;gap:1rem;}
.cs-section {padding:1.1rem 1.35rem;}
.cs-section h2 {gap:.65rem;}
.cs-section .cs-row {flex-wrap:nowrap;}
.cs-section .cs-muted {margin:1rem 0;}
.cs-section-foot {border-top:1px solid var(--line);padding-top:.85rem;margin-top:.25rem;}
.cs-menu {position:relative;flex-shrink:0;}
.cs-menu summary {display:grid;place-items:center;min-height:2.65rem;width:2.65rem;border-radius:.5rem;cursor:pointer;list-style:none;letter-spacing:.12em;font-size:.7rem;color:var(--mut);}
.cs-menu summary::-webkit-details-marker {display:none;}
.cs-menu[open] summary,.cs-menu summary:hover {background:var(--bg);}
.cs-menu-pop {position:absolute;right:0;top:100%;z-index:4;display:grid;min-width:10rem;padding:.3rem;border:1px solid var(--line);border-radius:.7rem;background:var(--card);box-shadow:0 .5rem 1.6rem #2320361a;}
.cs-menu-pop button {justify-content:flex-start;}
.cs-topic-row {display:flex;align-items:center;gap:1rem;border-top:1px solid var(--line);}
.cs-section>.cs-row {margin-bottom:.6rem;}
.cs-topic-link {flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:.5rem;min-height:3.5rem;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:620;padding:.5rem 0;overflow-wrap:anywhere;cursor:pointer;}
.cs-topic-link:hover {color:var(--acc);}
.cs-topic-link small {color:var(--mut);font-size:.82rem;font-weight:450;white-space:nowrap;}
.cs-study-tools {margin-bottom:1.1rem;}
.cs-toggle {display:inline-flex;gap:.55rem;background:transparent;color:var(--ink);border:0;padding:.5rem 0;font-size:.87rem;font-weight:600;min-height:2.75rem;cursor:pointer;}
.cs-switch {width:2rem;height:1.13rem;border-radius:2rem;background:#a09ca5;position:relative;}
.cs-switch::before {content:"";position:absolute;top:3px;left:3px;border-radius:50%;background:#fff;width:calc(1.13rem - 6px);height:calc(1.13rem - 6px);}
.cs-toggle[aria-pressed=true] .cs-switch {background:var(--acc);}
.cs-toggle[aria-pressed=true] .cs-switch::before {left:auto;right:3px;}
.cs-mastery {padding:1.35rem;}
.cs-meter {margin:1rem 0 .85rem;display:flex;border-radius:1rem;height:.55rem;overflow:hidden;}
.cs-legend {padding:0;list-style:none;flex-wrap:wrap;gap:.45rem 1.1rem;margin:0;}
.cs-legend li {gap:.37rem;font-size:.82rem;color:var(--mut);}
.cs-legend li b {color:var(--ink);}
.cs-legend i {width:.5rem;height:.5rem;border-radius:50%;}
.cs-lv-0 {background:#aaa7b0;}.cs-lv-1 {background:#d77360;}.cs-lv-2 {background:#d5a242;}.cs-lv-3 {background:#438f73;}
.cs-question-list,.cs-history {margin-top:2rem;}
.cs-list-head {margin-bottom:1rem;}
.cs-list {padding:0 1.35rem;}
.cs-question,.cs-history-row {display:flex;gap:1rem;padding:1.1rem 0;}
.cs-question+.cs-question,.cs-history-row+.cs-history-row {border-top:1px solid var(--line);}
.cs-index {display:grid;place-items:center;flex:0 0 1.85rem;height:1.85rem;border-radius:.45rem;background:var(--bg);color:var(--mut);font-size:.81rem;font-weight:600;}
.cs-question p {margin:.25rem 0 0;white-space:pre-wrap;line-height:1.55;}
.cs-question-meta {font-size:.8rem;}
.cs-stats {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;}
.cs-stat {padding:1.35rem;display:flex;flex-direction:column;gap:.5rem;}
.cs-stat>span {font-size:.9rem;color:var(--mut);}
.cs-stat strong {font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.05em;}
.cs-history-row {align-items:center;justify-content:space-between;}
.cs-history-row h3 {margin:0;font-size:1rem;}
.cs-history-row strong {font-size:.9rem;white-space:nowrap;}
.cs-reset {margin-top:1rem;}
.cs-alert,.cs-export {padding:1.25rem;margin:1.3rem 0;}
.cs-alert {border-color:#e1a8ad;}
.cs-alert ul {margin:.5rem 0;padding-inline-start:1.3rem;}
.cs-export label {display:block;color:var(--mut);font-size:.87rem;margin:.75rem 0 .45rem;}
.cs-field,#sbc {display:block;width:100%;min-width:0;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:.65rem;padding:.9rem;font: .95rem/1.5 'JetBrains Mono',ui-monospace,monospace;}
.cs-export .cs-actions {margin-top:1rem;}
.cs-kicker {margin:0;color:var(--acc);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.cs-view :is(button,summary,textarea):focus-visible,.cs-export :is(button,textarea):focus-visible {outline:3px solid var(--acc);outline-offset:2px;}
@media(max-width:650px) {
 .cs-page-head {margin-bottom:1.35rem;}
 .cs-stats {gap:.55rem;}
 .cs-stat {padding:.8rem;}
 .cs-stat>span {font-size:.8rem;}
 .cs-section,.cs-mastery {padding:1rem;}
 .cs-topic-link {align-items:flex-start;flex-direction:column;gap:.1rem;}
 .cs-breadcrumb {margin-bottom:.9rem;}
}
@media(max-width:360px) {
 .cs-stats {grid-template-columns:1fr;}
 .cs-stat {flex-direction:row;align-items:center;justify-content:space-between;}
}
.session-main { max-width: 51rem; margin-inline: auto; }
.session-heading { margin: 1.5rem 0; line-height: 1.12; }
.session-panel, .session-completion { padding: clamp(1.2rem, 4vw, 2.5rem); }
.session-prompt { font-size: clamp(1.25rem, 2.4vw, 1.65rem); font-weight: 680; letter-spacing: -.035em; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.session-progress { margin: 0 0 1.5rem; }
.session-progress-line { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; font-weight: 600; font-size: .875rem; }
.session-progress progress { display: block; appearance: none; width: 100%; height: .45rem; border: 0; border-radius: 2rem; overflow: hidden; background: #e8e5f2; color: #7251cd; }
.session-progress progress::-webkit-progress-bar { background: #e8e5f2; border-radius: 2rem; }
.session-progress progress::-webkit-progress-value { background: #7251cd; border-radius: 2rem; }
.session-progress progress::-moz-progress-bar { background: #7251cd; border-radius: 2rem; }
.session-timer { background: #ede8fe; color: #483089; border-radius: .35rem; padding: .1rem .5rem; font-variant-numeric: tabular-nums; }
.session-field-label { display: block; font-size: .875rem; font-weight: 650; margin: 1.75rem 0 .5rem; }
.session-field { display: block; width: 100%; resize: vertical; min-height: 5rem; font: 1rem/1.5 ui-monospace, monospace; }
.session-sandbox textarea { display: block; width: 100%; min-height: 4rem; margin: 1rem 0 .5rem; border: 1px solid #cbc9d0; border-radius: .5rem; padding: .75rem; font: 1rem/1.5 ui-monospace, monospace; }
.session-sandbox iframe { display: block; }
.session-actions, .session-practice { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }
.session-actions { padding-top: 1.3rem; border-top: 1px solid #e2dfe6; }
.session-key { font-size: .75rem; color: #645e6b; margin-inline-start: .2rem; }
.session-revealed, .session-feedback { border-radius: .7rem; padding: 1rem 1.15rem; margin-top: 1.5rem; }
.session-revealed { background: #f1edfb; color: #33284c; }
.session-feedback.session-correct { color: #215339; background: #edf6eb; }
.session-feedback.session-incorrect { color: #783a29; background: #fcf0e9; }

  const answer = norm(value, ci);

  return t;
}

  const ids = new Set(t.qs.map(q => q.id));
  for (const map of [db.wrong, db.lv]) {
    Object.keys(map).forEach(k => { if (k.startsWith(prefix) && !ids.has(k.slice(prefix.length))) delete map[k]; });

}

  }
  if (!files.length) return showErr(['Plik nie zawiera żadnych zestawów pytań.']);

    const existing = tid ? findT(tid)?.t : db.subjects[f.subject].find(s=>s.name===f.section)?.topics.find(t=>t.name===f.topic);
    const prior = changes.get(key)?.qs ?? existing?.qs ?? [];
    let qs = f.questions;
    if (prior.length) {
      const choice = await askDialog({
        title:'Import do tematu „' + (existing?.name || f.topic) + '”',
        note:'Zestaw zawiera już pytania. Przy scalaniu pytania o tych samych identyfikatorach zostaną zaktualizowane.',

}

  const files = [];
  for (const s of SUBJ) for (const sec of db.subjects[s]) for (const t of sec.topics) {
    if (!tid || t.id === tid) files.push({subject:s, section:sec.name, topic:t.name, questions:t.qs});
  }

}

}

  try {
    const tree = await fetch('https://api.github.com/repos/' + c.repo + '/git/trees/' + encodeURIComponent(c.branch) + '?recursive=1');

      (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') +

  topic(id){ const f=findT(id); if (!f) return; S.v='topic'; S.t=id; S.s=f.s; S.exp=null; S.err=null; render(); },
  async addsec(){ const name=await askName('Dodaj dział','Nazwa działu'); if(name){ db.subjects[S.s].push({id:uid(),name,topics:[]}); save(); render(); } },
  rensec(id){ return renameItem(db.subjects[S.s].find(s=>s.id===id),'Nazwa działu'); },
  async delsec(id){
    const list=db.subjects[S.s], sec=list.find(s=>s.id===id);
    if (sec && await askRemove('Usunąć dział „'+sec.name+'”?','Usuniesz też wszystkie jego tematy i pytania.')) {
      sec.topics.forEach(removeTopicProgress); list.splice(list.indexOf(sec),1); save(); render();
    }
  },
  async addtop(id){ const name=await askName('Dodaj temat','Nazwa tematu'); if(name){ db.subjects[S.s].find(s=>s.id===id).topics.push({id:uid(),name,qs:[]}); save(); render(); } },
  rentop(id){ return renameItem(findT(id).t,'Nazwa tematu'); },
  async deltop(id){
    const f=findT(id);
    if(f && await askRemove('Usunąć temat „'+f.t.name+'”?','Usuniesz także wszystkie jego pytania.')) {
      removeTopicProgress(f.t); f.sec.topics=f.sec.topics.filter(t=>t.id!==id); save(); render();
    }
  },

  exptop(){ exportData(S.t); },
  downloadexp:downloadExport,
  closeexp(){ S.exp=null; render(); },
  closeerr(){ S.err=null; render(); },
  async copy(){
    const output=document.getElementById('exp'); output?.select();
    try { await navigator.clipboard.writeText(S.exp); toast('Skopiowano JSON.'); }
    catch { toast('Zaznaczono tekst. Możesz go teraz skopiować.'); }
  },
  sync(){ return sync(false); },
  async setrepo(){
    const c=ghCfg() || {};
    const r=await askDialog({title:'Repozytorium GitHub',note:'Materiały są pobierane z katalogu materials w publicznym repozytorium.',
      fields:[{key:'repo',label:'Właściciel i repozytorium',placeholder:'login/nazwa',value:c.repo},{key:'branch',label:'Gałąź',value:c.branch || 'main'}],
      choices:[['cancel','Anuluj'],['save','Zapisz i synchronizuj']]});
    if (!r) return;
    if (!/^[\w.-]+\/[\w.-]+$/.test(r.repo)) return toast('Wpisz repozytorium w formacie login/nazwa.');
    db.gh={repo:r.repo,branch:r.branch}; save(); render(); await sync(false);
  },
  study(){ startStudy(items(S.t)); },
  five(){ db.five=!db.five; save(); render(); },
  show(){ const st=S.st; if(st.stage==='t') st.val=document.getElementById('tans').value; st.stage='a'; render(); },
  retype(){ const st=S.st; st.stage='t'; st.val=''; st.tres=null; render(); document.getElementById('tans')?.focus(); },
  tcheck(){
    const st=S.st, it=st.qs[0]; st.val=document.getElementById('tans').value;
    if(!st.val.trim()) return toast('Wpisz odpowiedź.');
    st.tres={ok:check(it.q,it.s,st.val)}; render();
  },
  tnext(){ rate(S.st.tres.ok); }, yes(){ rate(true); }, no(){ rate(false); },
  sb(){ S.st.sb=!S.st.sb; render(); runSb(); }, run:runSb,
  goon(){ S.st.over=false; S.st.lim=null; render(); },
  start(){ begin(items(S.t)); }, startwrong(){ begin(items(S.t,true)); }, startallwrong(){ begin(allWrong()); },
  redo(){ begin(S.q.qs.filter(x=>x.bad).map(x=>({...x,bad:false}))); },
  check(){
    const Q=S.q; if(Q.res) return;
    const it=Q.qs[Q.i]; Q.val=document.getElementById('ans').value;
    if(!Q.val.trim()) return toast('Wpisz odpowiedź.');
    const ok=check(it.q,it.s,Q.val), key=it.tid+'|'+it.q.id;
    Q.res={ok}; it.bad=!ok; db.solved++;
    if(ok){ Q.ok++; db.ok++; delete db.wrong[key]; } else db.wrong[key]=1;
    save(); render();
  },
  next(){
    const Q=S.q; if(!Q.res) return;
    Q.res=null; Q.val='';
    if(++Q.i>=Q.qs.length){
      db.hist.unshift({d:new Date().toLocaleDateString('pl-PL'),name:Q.qs[0].name,n:Q.qs.length,c:Q.ok});
      db.hist=db.hist.slice(0,100); rememberTopics(Q.qs.map(x=>x.tid)); save(); S.v='result';
    }
    render();
  },
  async reset(){
    if(await askRemove('Wyczyścić postępy?','Historia quizów, poziomy opanowania i statystyki zostaną usunięte. Materiały pozostaną dostępne.')){
      db.hist=[]; db.wrong={}; db.lv={}; db.recent=[]; db.solved=0; db.ok=0; save(); render();
    }
  }
};
document.addEventListener('click',e=>{
  document.querySelectorAll('.manage[open]').forEach(m=>{ if(!m.contains(e.target)) m.open=false; });
  const b=e.target.closest('[data-a]');
  if (b && !b.disabled && Object.hasOwn(H,b.dataset.a)) H[b.dataset.a](b.dataset.i);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const menu=document.activeElement?.closest('.manage[open]');
    if(menu){menu.open=false;menu.querySelector('summary').focus();}
  }
  if(e.key==='Enter' && (e.ctrlKey || e.metaKey) && S.v==='quiz' && !document.querySelector('dialog[open]')) {
    e.preventDefault(); S.q.res ? H.next() : H.check();
  }
});

function csCount(value, one, few, many) {
  const n = Number(value);
  const last = n % 10, tens = n % 100;
  return n + ' ' + (n === 1 ? one : last >= 2 && last <= 4 && (tens < 12 || tens > 14) ? few : many);
}
function csQuestions(n) { return csCount(n, 'pytanie', 'pytania', 'pytań'); }

}

function csLevels(t) {
  const levels = [0,0,0,0];
  t.qs.forEach(q => {
    const level = lvOf(t.id,q);
    levels[level === undefined ? 0 : level === 0 ? 1 : level === 1 ? 2 : 3]++;
  });
  const labels = ['Nowe','Do powtórki','W trakcie','Opanowane'];
  return `<section class="cs-panel cs-mastery"><h2>Znajomość pytań</h2><div class="cs-meter" aria-hidden="true">${levels.map((n,i)=> n ? `<span class="cs-lv-${i}" style="flex:${n}"></span>`:'').join('')}</div><ul class="cs-legend">${levels.map((n,i)=>`<li><i class="cs-lv-${i}"></i>${labels[i]} <b>${n}</b></li>`).join('')}</ul></section>`;
}

  return `<div class="cs-view">${crumb}<div class="cs-page-head"><div><h1 class="cs-heading">${esc(t.name)}</h1><p class="cs-meta">${csQuestions(t.qs.length)}${wrong ? ' · '+wrong+' do powtórki w quizie' : ''}</p></div></div>${errBox()}${expBox()}${t.qs.length ? `
    <div class="cs-study-tools"><div class="cs-actions">${csBtn('study','Ucz się',{kind:'primary',iconName:'bookOpen'})}${csBtn('start','Rozpocznij quiz',{kind:'secondary'})}${wrong ? csBtn('startwrong','Powtórz błędne ('+wrong+')') : ''}</div><button type="button" aria-pressed="${db.five}" class="cs-toggle" data-a="five"><span class="cs-switch" aria-hidden="true"></span>Fiszki na 5 minut</button></div>
    ${csLevels(t)}<section class="cs-question-list"><div class="cs-row cs-list-head"><h2>Pytania w temacie</h2><div class="cs-actions">${csBtn('imptop','Importuj',{iconName:'upload'})}${csBtn('exptop','Eksportuj',{iconName:'download'})}</div></div><div class="cs-panel cs-list">${t.qs.map((q,i)=>`<div class="cs-question"><span class="cs-index">${i+1}</span><div><span class="cs-meta cs-question-meta">${esc(typeLabels[q.type] || q.type)} · ${esc(q.id)}</span><p>${esc(q.question)}</p></div></div>`).join('')}</div></section>` : `<section class="cs-panel cs-empty"><span class="cs-empty-icon">${icon('bookOpen',28)}</span><h2>Dodaj pytania do tematu</h2><p>Zaimportuj zestaw w formacie JSON, aby rozpocząć naukę.</p>${csBtn('imptop','Importuj pytania',{kind:'primary',iconName:'upload'})}</section>`}</div>`;
}
function stats() {
  const total = db.solved, accuracy = total ? Math.round(100*db.ok/total)+'%' : '–';
  const wrong = allWrong().length;
  return `<div class="cs-view">${csCrumb([{action:'home',text:'Pulpit'},{text:'Postępy'}])}<div class="cs-page-head"><div><h1 class="cs-heading">Twoje postępy</h1></div>${wrong ? csBtn('startallwrong','Powtórz błędne pytania ('+wrong+')',{kind:'primary'}) : ''}</div><div class="cs-stats">${[[total,'Rozwiązane pytania'],[db.ok,'Poprawne odpowiedzi'],[accuracy,'Skuteczność']].map(([value,label])=>`<div class="cs-panel cs-stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div><section class="cs-history"><div class="cs-row cs-list-head"><h2>Historia quizów</h2></div>${db.hist.length ? `<div class="cs-panel cs-list">${db.hist.slice(0,30).map(h=>`<div class="cs-history-row"><div><h3>${esc(h.name)}</h3><span class="cs-meta">${esc(h.d)}</span></div><strong aria-label="${esc(h.c)} poprawnych z ${esc(h.n)}">${esc(h.c)} / ${esc(h.n)}</strong></div>`).join('')}</div>` : '<div class="cs-panel cs-empty"><span class="cs-empty-icon">'+icon('chart',28)+'</span><h3>Historia czeka na pierwszy quiz</h3><p>Po ukończeniu quizu zobaczysz tutaj jego temat, datę i wynik.</p>'+csBtn('home','Wybierz przedmiot')+'</div>'}</section>${(total || db.hist.length || wrong || db.recent.length) ? '<div class="cs-reset">'+csBtn('reset','Wyczyść postępy',{kind:'plain'})+'</div>' : ''}</div>`;
}
function sessionNavigation(item, current) {
  const topic = findT(item.tid);
  return csCrumb([
    { action: 'home', text: 'Pulpit' },
    ...(topic ? [
      { action: 'subj', id: topic.s, text: topic.s },
      { action: 'topic', id: item.tid, text: topic.t.name }
    ] : []),
    { text: current }
  ]);
}

function sessionProgress(label, value, total, timer = '') {
  return `<div class="session-progress">
    <div class="session-progress-line"><span>${esc(label)}</span>${timer}</div>
    <progress aria-label="${esc(label)}" value="${value}" max="${total}"></progress>
  </div>`;
}

function sessionFeedback(ok, question) {
  return `<div role="status" class="session-feedback ${ok ? 'session-correct' : 'session-incorrect'}">
    <strong>${ok ? 'Poprawna odpowiedź' : 'Pytanie do powtórki'}</strong>
    ${ok ? '' : `<div class="session-answer-label">Poprawna odpowiedź</div><pre class="session-answer-text">${esc(question.correct_answer)}</pre>`}
  </div>
  <div class="session-explanation"><h3>Wyjaśnienie</h3><p>${esc(question.explanation)}</p></div>`;
}

function sessionField(id, label, value, readonly = false) {
  return `<label for="${id}" class="session-field-label">${label}</label>
    <textarea class="cs-field session-field" id="${id}" rows="4" placeholder="Wpisz odpowiedź…"
      spellcheck="false" autocapitalize="off" autocomplete="off" ${readonly ? 'readonly' : ''}>${esc(value || '')}</textarea>`;
}

function quiz() {
  const state = S.q;
  const item = state.qs[state.i];
  const question = item.q;
  const answered = !!state.res;
  const position = state.i + 1;
  return `<div class="session-wrap">${sessionNavigation(item, 'Quiz')}
    <div class="session-main">
      <h1 class="cs-heading session-heading">Quiz</h1>
      ${sessionProgress(`Pytanie ${position} z ${state.qs.length}`, state.i + Number(answered), state.qs.length)}
      <section class="cs-panel session-panel">
        <h2 class="session-prompt">${esc(question.question)}</h2>
        ${sessionField('ans', 'Twoja odpowiedź', state.val, answered)}
        ${answered ? sessionFeedback(state.res.ok, question) : ''}
        <div class="session-actions">
          ${answered ? csBtn('next', position === state.qs.length ? 'Zobacz wynik' : 'Następne pytanie', { kind: 'primary' }) : csBtn('check', 'Sprawdź odpowiedź', { kind: 'primary' })}
          <span class="session-key">Ctrl / ⌘ + Enter</span>
        </div>
      </section>
    </div>
  </div>`;
}

function result() {
  const state = S.q;
  const item = state.qs[0];
  const retryCount = state.qs.filter(entry => entry.bad).length;
  return `<div class="session-wrap">${sessionNavigation(item, 'Wynik')}
    <div class="session-main"><section class="cs-panel session-completion">
      <h1 class="cs-heading session-heading">Quiz ukończony</h1>
      <div class="session-score">${Math.round(state.ok / state.qs.length * 100)}<span>%</span></div>
      <p>Poprawne odpowiedzi: <strong>${state.ok} z ${state.qs.length}</strong></p>
      <div class="session-actions">
        ${retryCount ? csBtn('redo', `Powtórz błędne (${retryCount})`, { kind: 'primary' }) : ''}
        ${csBtn('topic', 'Wróć do tematu', { id: item.tid, kind: retryCount ? 'secondary' : 'primary' })}
      </div>
    </section></div>
  </div>`;
}

function study() {
  const state = S.st;
  const done = !state.qs.length;
  const item = state.qs[0] || { tid: S.t };
  if (done || state.over) {
    return `<div class="session-wrap">${sessionNavigation(item, 'Nauka')}
      <div class="session-main"><section class="cs-panel session-completion">
        <h1 class="cs-heading session-heading">${done ? 'Sesja ukończona' : 'Minęło 5 minut'}</h1>
        <p>Opanowane pytania: <strong>${state.known} z ${state.total}</strong></p>
        ${sessionProgress('Postęp sesji', state.known, state.total)}
        <div class="session-actions">
          ${done ? '' : csBtn('goon', 'Kontynuuj bez limitu', { kind: 'primary' })}
          ${csBtn('topic', 'Wróć do tematu', { id: S.t, kind: done ? 'primary' : 'secondary' })}
        </div>
      </section></div>
    </div>`;
  }

  const question = item.q;
  let content = '';
  let actions = '';
  if (state.stage === 'q') {
    actions = csBtn('show', 'Pokaż odpowiedź', { kind: 'primary' });
  } else if (state.stage === 'a') {
    const code = runnable(item);
    const retype = /^(write_|fill_)/.test(question.type);
    content = `<div class="session-revealed">
      <div class="session-answer-label">Odpowiedź</div><pre class="session-answer-text">${esc(question.correct_answer)}</pre>
      </div><div class="session-explanation"><h3>Wyjaśnienie</h3><p>${esc(question.explanation)}</p></div>
      ${retype || code ? `<div class="session-practice">
        ${retype ? csBtn('retype', 'Przepisz z pamięci') : ''}
        ${code ? csBtn('sb', state.sb ? 'Zamknij edytor' : 'Wypróbuj kod') : ''}
      </div>` : ''}
      ${state.sb && code ? `<div class="session-sandbox">${sbPanel(code)}</div>` : ''}`;
    actions = csBtn('no', 'Jeszcze nie') + csBtn('yes', 'Wiem', { kind: 'primary' });
  } else {
    content = sessionField('tans', 'Odpowiedź z pamięci', state.val, !!state.tres);
    if (state.tres) content += sessionFeedback(state.tres.ok, question);
    actions = state.tres ? csBtn('tnext', 'Dalej', { kind: 'primary' }) :
      csBtn('show', 'Podejrzyj odpowiedź') + csBtn('tcheck', 'Sprawdź', { kind: 'primary' });
  }

  const timer = state.lim ? `<span class="session-timer" aria-label="Pozostały czas" id="tm">${fmt(state.lim - (Date.now() - state.t0))}</span>` : '';
  return `<div class="session-wrap">${sessionNavigation(item, 'Nauka')}
    <div class="session-main">
      <h1 class="cs-heading session-heading">Nauka z fiszkami</h1>
      ${sessionProgress(`Opanowane pytania: ${state.known} z ${state.total}`, state.known, state.total, timer)}
      <section class="cs-panel session-panel">
        <h2 class="session-prompt">${esc(question.question)}</h2>
        ${content}
        <div class="session-actions">${actions}</div>
      </section>
    </div>
  </div>`;
}

glyphs.bookOpen=glyphs.book;
function icon(name,size=20){return '<svg aria-hidden="true" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">'+(glyphs[name]||glyphs.file)+'</svg>'}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,3600)}
let subjectLayout='grid';
const genre={HTML:'Tworzenie stron',SQL:'Bazy danych',Fizyka:'Nauki ścisłe'};
function countWord(n,one,few,many){return n===1?one:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?few:many}
function courseCards(){return SUBJ.map((s,i)=>{let secs=db.subjects[s],n=secs.reduce((a,b)=>a+b.topics.reduce((v,t)=>v+t.qs.length,0),0);
return '<button class="course course-'+i+'" data-a="subj" data-i="'+s+'"><span class="course-top"><span class="course-text"><span class="genre">'+genre[s]+'</span><strong>'+s+'</strong></span><span class="course-art">'+subjectArt(s)+'</span></span><span class="course-foot"><span>'+icon('folder',15)+' '+secs.length+' '+countWord(secs.length,'dział','działy','działów')+'</span><i></i><span>'+n+' '+countWord(n,'pytanie','pytania','pytań')+'</span><span class="open-course">'+icon('chevron',13)+'</span></span></button>'}).join('')}
function resources(){const cfg=ghCfg();return '<div class="resource-rows"><div class="resource-row"><span class="resource-icon">'+icon('github',24)+'</span><div><strong>GitHub</strong><small>'+esc(cfg?.repo||'Repozytorium materiałów')+'</small></div><button class="mini" data-a="'+(cfg?'sync':'setrepo')+'">'+(cfg?'Synchronizuj':'Połącz')+'</button>'+(cfg?'<button class="iconbtn" data-a="setrepo" aria-label="Ustawienia repozytorium">'+icon('settings',16)+'</button>':'')+'</div><div class="resource-row"><span class="resource-icon">'+icon('file',22)+'</span><div><strong>Pliki JSON</strong><small>Import i eksport materiałów</small></div><button class="iconbtn" data-a="impmeta" title="Importuj plik JSON" aria-label="Importuj plik JSON">'+icon('upload',17)+'</button><button class="iconbtn" data-a="exportall" title="Eksportuj wszystko" aria-label="Eksportuj wszystko">'+icon('download',17)+'</button></div></div>'}
function home(){const recent=db.recent.map(findT).filter(Boolean).slice(0,3);
return '<section class="desk-window"><div class="window-chrome" aria-hidden="true"><span class="traffic"><i></i><i></i><i></i></span><span>pulpit.exe</span><span class="chrome-end">⌁</span></div><div class="hero-body"><div class="hero-copy"><div class="date-line">'+icon('calendar',14)+new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',year:'numeric'}).format(new Date())+'</div><h1>Pulpit nauki<span>.</span></h1><p>Twoje przedmioty, pytania i powtórki w jednym miejscu.<br class="desktop-break"> Wybierz materiał i zacznij ćwiczyć.</p><button class="hero-cta" data-a="choose">'+icon('bookOpen',17)+'Wybierz przedmiot</button></div><div class="hero-art">'+heroArt()+'</div></div></section>'+errBox()+expBox()+
'<section class="subjects-section" id="subjects"><div class="section-title"><h2>Twoje przedmioty</h2><div class="layout-toggle" aria-label="Układ przedmiotów">'+['grid','list'].map((v,i)=>'<button class="'+(subjectLayout===v?'sel':'')+'" data-a="layout" data-i="'+v+'" aria-label="'+(i?'Widok listy':'Widok kafelków')+'" aria-pressed="'+(subjectLayout===v)+'">'+icon(v,16)+'</button>').join('')+'</div></div><div class="course-grid '+(subjectLayout==='list'?'is-list':'')+'">'+courseCards()+'</div></section>'+
'<div class="dashboard-bottom"><section class="desk-panel"><div class="panel-heading"><span class="panel-icon">'+icon('chart',19)+'</span><h2>Twoja aktywność</h2><button class="more" data-a="stats">Szczegóły</button></div><div class="metrics">'+[[db.solved,'Rozwiązane','file'],[db.solved?Math.round(db.ok/db.solved*100)+'%':'0%','Skuteczność','target'],[allWrong().length,'Do powtórki','rotate']].map(([val,label,ic])=>'<div class="metric"><span>'+icon(ic,18)+'</span><strong>'+val+'</strong><small>'+label+'</small></div>').join('')+'</div></section><section class="desk-panel"><div class="panel-heading"><span class="panel-icon">'+icon('folder',19)+'</span><h2>Twoje materiały</h2></div>'+resources()+'</section></div>'+
(recent.length?'<section class="recent"><h2>Ostatnio przerabiane</h2>'+recent.map(f=>'<button class="recent-row" data-a="topic" data-i="'+esc(f.t.id)+'">'+icon('clock')+'<span>'+esc(f.t.name)+'</span><small>'+esc(f.s)+' · '+esc(f.sec.name)+'</small></button>').join('')+'</section>':'')}

function render(){const v={home,subject,topic,quiz,result,stats,study};let tab=S.v==='stats'?'stats':'home';
document.getElementById('app').innerHTML='<header class="topbar"><div class="shell bar-inner"><button data-a="home" class="wordmark" aria-label="CodeStudy – pulpit"><span class="brand-mark">'+icon('terminal',22)+'</span>CodeStudy</button><nav aria-label="Menu główne">'+[['home','grid','Pulpit'],['stats','chart','Postępy']].map(([a,ic,t])=>'<button data-a="'+a+'" '+(tab===a?'aria-current="page"':'')+'>'+icon(ic,17)+t+'</button>').join('')+'</nav><button '+(!['home','subject','topic'].includes(S.v)?'hidden style="display:none"':'')+' class="import-top" data-a="impmeta">'+icon('upload',16)+'<span>Importuj plik</span></button></div></header><main class="shell main" id="main">'+v[S.v]()+'</main>';window.scrollTo(0,0);const a=document.getElementById('ans');if(a&&!S.q.res&&matchMedia('(pointer:fine)').matches)a.focus({preventScroll:true})}
render();
if(ghCfg())sync(true);
